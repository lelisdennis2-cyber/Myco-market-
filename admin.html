<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Myco Market | Private Admin</title><link rel="stylesheet" href="style.css"><style>body{padding:24px;background:#f5f5ef}.admin{max-width:850px;margin:30px auto;background:white;padding:28px;border-radius:16px}.admin form{display:grid;gap:12px}.admin input,.admin textarea,.admin select{padding:12px;border:1px solid #ddd;border-radius:8px}.admin button{padding:12px;background:#1c3b2b;color:white;border:0;border-radius:8px}.product-row{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #ddd}.hidden{display:none}</style></head><body><main class="admin"><h1>Myco Market — Private Admin</h1><p>This page is separate from the public shop. Keep your admin password private.</p><section id="login"><h2>Admin sign in</h2><form id="loginForm"><input id="adminPassword" type="password" placeholder="Admin password" required><button>Sign in</button></form><p id="loginMsg"></p></section><section id="manager" class="hidden"><h2>Add a product</h2><form id="productForm"><input name="name" placeholder="Product name" required><textarea name="description" placeholder="Description" required></textarea><input name="price" type="number" min="0" step="0.01" placeholder="Price" required><select name="currency"><option>NGN</option><option>USD</option><option>GBP</option><option>EUR</option><option>CAD</option><option>AUD</option><option>GHS</option><option>KES</option><option>ZAR</option><option>INR</option></select><input name="category" placeholder="Category" required><input name="image" type="file" accept="image/png,image/jpeg,image/webp"><button>Save product</button></form><h2>Manage products</h2><div id="products"></div><button id="logout">Sign out</button><p id="msg"></p></section></main><script>const $=id=>document.getElementById(id);async function call(url,opt={}){let r=await fetch('/api'+url,{credentials:'include',...opt});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function load(){let d=await call('/admin/products');$('products').innerHTML=d.products.map(p=>`<div class="product-row"><span>${p.name} — ${p.currency} ${p.price}</span><button data-del="${p.id}">Delete</button></div>`).join('')||'<p>No products yet.</p>'}$('loginForm').onsubmit=async e=>{e.preventDefault();try{await call('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('adminPassword').value})});$('login').classList.add('hidden');$('manager').classList.remove('hidden');await load()}catch(x){$('loginMsg').textContent=x.message}};$('productForm').onsubmit=async e=>{e.preventDefault();try{let fd=new FormData(e.target);await call('/admin/products',{method:'POST',body:fd});e.target.reset();$('msg').textContent='Product saved.';await load()}catch(x){$('msg').textContent=x.message}};$('products').onclick=async e=>{let id=e.target.dataset.del;if(id&&confirm('Delete this product?')){await call('/admin/products/'+id,{method:'DELETE'});await load()}};$('logout').onclick=async()=>{await call('/admin/logout',{method:'POST'});location.reload()};</script></body></html>
